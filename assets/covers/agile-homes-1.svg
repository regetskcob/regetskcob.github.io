<svg xmlns="http://www.w3.org/2000/svg" width="2000" height="2000" viewBox="0 -500 2000 2000">
  <!-- Cover for "Die Agile Homes GmbH", part 1 of the little series about the
       invented construction firm: a house in timber frame under a crane, next to
       a task board with sticky notes. Flat style of the other generated covers.
       The artwork is 2000x1000 (y 0 to 1000) in the middle of a square canvas
       (qlmanage fits the render to the height). Render with qlmanage (size 2000),
       then sips crops the centre strip (sips -c 1000 2000) and converts it to
       JPEG (quality 88). The dots at the bottom mark the part in the series. -->
  <rect x="0" y="-500" width="2000" height="2000" fill="#f3efe6"/>
  <g stroke-linecap="round" stroke-linejoin="round" fill="none">
    <!-- ground -->
    <path d="M520 760 H1480" stroke="#9a9a94" stroke-width="3"/>
    <!-- house in timber frame -->
    <rect x="590" y="500" width="310" height="260" fill="#faf9f4" stroke="#2b2b29" stroke-width="3"/>
    <path d="M590 500 L745 390 L900 500" stroke="#2b2b29" stroke-width="3"/>
    <path d="M745 390 V500" stroke="#9a9a94" stroke-width="3"/>
    <g stroke="#9a9a94" stroke-width="3">
      <path d="M642 500 V760 M694 500 V760 M746 500 V760 M798 500 V760 M850 500 V760"/>
      <path d="M590 630 H900"/>
    </g>
    <!-- window, door and the beam the crane is carrying -->
    <rect x="826" y="540" width="52" height="64" stroke="#2b2b29" stroke-width="3" stroke-dasharray="6 8"/>
    <rect x="652" y="672" width="64" height="88" fill="#faf9f4" stroke="#2b2b29" stroke-width="3"/>
    <!-- crane -->
    <path d="M1010 760 V300" stroke="#2b2b29" stroke-width="4"/>
    <path d="M1050 760 V300" stroke="#2b2b29" stroke-width="4"/>
    <path d="M1010 700 L1050 660 L1010 620 L1050 580 L1010 540 L1050 500 L1010 460 L1050 420 L1010 380 L1050 340" stroke="#9a9a94" stroke-width="3"/>
    <rect x="990" y="760" width="80" height="14" fill="#2b2b29" stroke="none"/>
    <path d="M640 300 H1190" stroke="#2b2b29" stroke-width="4"/>
    <path d="M640 300 L1030 240 L1190 300" stroke="#9a9a94" stroke-width="3"/>
    <rect x="1150" y="300" width="60" height="44" fill="#c9c6bd" stroke="#2b2b29" stroke-width="3"/>
    <path d="M700 300 V420" stroke="#2b2b29" stroke-width="3"/>
    <rect x="672" y="420" width="56" height="12" rx="3" fill="#b55229" stroke="#2b2b29" stroke-width="3"/>
    <!-- task board -->
    <g>
      <path d="M1180 700 L1200 760 M1420 700 L1400 760" stroke="#2b2b29" stroke-width="3"/>
      <rect x="1140" y="400" width="320" height="300" rx="6" fill="#faf9f4" stroke="#2b2b29" stroke-width="3"/>
      <path d="M1247 400 V700 M1353 400 V700 M1140 450 H1460" stroke="#c9c6bd" stroke-width="3"/>
      <rect x="1166" y="422" width="52" height="8" rx="4" fill="#9a9a94" stroke="none"/>
      <rect x="1273" y="422" width="52" height="8" rx="4" fill="#9a9a94" stroke="none"/>
      <rect x="1379" y="422" width="52" height="8" rx="4" fill="#9a9a94" stroke="none"/>
      <!-- to do -->
      <g fill="#faf9f4" stroke="#2b2b29" stroke-width="2.5">
        <rect x="1160" y="470" width="66" height="52"/><rect x="1160" y="534" width="66" height="52"/><rect x="1160" y="598" width="66" height="52"/>
      </g>
      <!-- doing -->
      <g stroke="#2b2b29" stroke-width="2.5">
        <rect x="1266" y="470" width="66" height="52" fill="#b55229"/><rect x="1266" y="534" width="66" height="52" fill="#faf9f4"/>
      </g>
      <!-- done -->
      <rect x="1372" y="470" width="66" height="52" fill="#faf9f4" stroke="#2b2b29" stroke-width="2.5"/>
      <path d="M1390 498 L1402 510 L1424 484" stroke="#b55229" stroke-width="4"/>
      <g stroke="#9a9a94" stroke-width="3"><path d="M1172 488 H1212 M1172 500 H1200 M1172 552 H1212 M1172 564 H1198 M1172 616 H1212 M1278 552 H1318 M1278 564 H1306"/></g>
    </g>
    <!-- the part in the series -->
    <path d="M960 880 H1040" stroke="#9a9a94" stroke-width="3"/>
    <circle cx="960" cy="880" r="11" fill="#b55229" stroke="none"/>
    <circle cx="960" cy="880" r="19" stroke="#b55229" stroke-width="2.5" opacity="0.5"/>
    <circle cx="1040" cy="880" r="9" fill="#f3efe6" stroke="#9a9a94" stroke-width="3"/>
  </g>
</svg>
