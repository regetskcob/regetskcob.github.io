<svg xmlns="http://www.w3.org/2000/svg" width="2000" height="2000" viewBox="0 -500 2000 2000">
  <!-- Cover for the legal page: a document with a paragraph sign and a shield
       with a keyhole, in the flat style of the other generated covers.
       The artwork is 2000x1000 (y 0 to 1000); the canvas is square with it in
       the middle, because macOS's qlmanage fits the render to the height.
       Render with qlmanage (size 2000), then sips crops the centre strip
       (sips -c 1000 2000) and converts it to JPEG (quality 88). -->
  <rect x="0" y="-500" width="2000" height="2000" fill="#f3efe6"/>
  <!-- A little smaller and higher: the title bar of the page cover covers the lower third. -->
  <g transform="translate(45 -90) translate(1000 500) scale(0.86) translate(-1000 -500)" stroke-linecap="round" stroke-linejoin="round">
    <!-- the page behind -->
    <g transform="rotate(-5 790 500)">
      <rect x="520" y="200" width="460" height="620" rx="6" fill="#faf9f4" stroke="#2b2b29" stroke-width="3"/>
      <rect x="570" y="255" width="150" height="9" rx="4.5" fill="#9a9a94"/>
      <rect x="570" y="300" width="360" height="9" rx="4.5" fill="#c9c6bd"/>
      <rect x="570" y="340" width="300" height="9" rx="4.5" fill="#c9c6bd"/>
    </g>
    <!-- the page in front -->
    <rect x="560" y="180" width="460" height="640" rx="6" fill="#faf9f4" stroke="#2b2b29" stroke-width="3"/>
    <rect x="610" y="240" width="180" height="13" rx="6.5" fill="#2b2b29"/>
    <text x="842" y="372" font-family="Georgia, 'Times New Roman', serif" font-size="190" fill="#b55229">§</text>
    <g fill="#9a9a94">
      <rect x="610" y="440" width="360" height="9" rx="4.5"/>
      <rect x="610" y="486" width="320" height="9" rx="4.5"/>
      <rect x="610" y="532" width="360" height="9" rx="4.5"/>
      <rect x="610" y="578" width="260" height="9" rx="4.5"/>
      <rect x="610" y="624" width="340" height="9" rx="4.5"/>
    </g>
    <path d="M612 742 C650 690 668 770 700 722 C724 690 742 760 780 716" fill="none" stroke="#b55229" stroke-width="4"/>
    <rect x="610" y="768" width="190" height="4" rx="2" fill="#2b2b29"/>
    <!-- link from the page to the shield -->
    <path d="M1036 500 H1086" fill="none" stroke="#9a9a94" stroke-width="3" stroke-dasharray="2 12"/>
    <!-- the shield, its keyhole with a glow like the LED of the Arduino cover -->
    <circle cx="1250" cy="520" r="112" fill="none" stroke="#b55229" stroke-width="3" opacity="0.4"/>
    <circle cx="1250" cy="520" r="84" fill="none" stroke="#b55229" stroke-width="3" opacity="0.6"/>
    <path d="M1250 322 L1396 378 V540 C1396 650 1334 712 1250 756 C1166 712 1104 650 1104 540 V378 Z" fill="#faf9f4" stroke="#2b2b29" stroke-width="3"/>
    <circle cx="1250" cy="514" r="34" fill="#b55229"/>
    <path d="M1234 534 H1266 L1278 604 H1222 Z" fill="#b55229"/>
  </g>
</svg>
