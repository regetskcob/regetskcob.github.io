    <!-- the part in the series -->
    <path d="M880 900 H1120" stroke="#9a9a94" stroke-width="3"/>
    <circle cx="880" cy="900" r="8" fill="#2b2b29" stroke="none"/><circle cx="928" cy="900" r="8" fill="#2b2b29" stroke="none"/><circle cx="976" cy="900" r="8" fill="#2b2b29" stroke="none"/><circle cx="1024" cy="900" r="8" fill="#2b2b29" stroke="none"/><circle cx="1072" cy="900" r="8" fill="#2b2b29" stroke="none"/>
    <circle cx="1120" cy="900" r="11" fill="#b55229" stroke="none"/>
    <circle cx="1120" cy="900" r="19" stroke="#b55229" stroke-width="2.5" opacity="0.5"/>
  </g>
