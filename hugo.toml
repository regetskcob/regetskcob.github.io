baseURL = 'https://regetskcob.github.io'
languageCode = 'de-de'
title = 'regetskcob'
theme = 'typo'

[taxonomies]
tag = 'tags'

[module]
  [[module.imports]]
    path = 'github.com/hugomods/umami-analytics'
    
[caches]
  [caches.images]
    dir = ':cacheDir/images'

[params]
# Meta description
description = "Eine wilde Mischung aus Natur, Fotografie und Technik."

# Appearance settings
colorPalette = 'default'
hideHeader = false

# Intro on main page, content is markdown
homeIntroTitle = 'Hi!'
homeIntroContent = """
ich bin Daniel, online meistens als @regetskcob unterwegs. Beruflich bin ich Software Entwickler bei der BWI GmbH, wo ich in der Prototypen-Entwicklung mit Flutter tätig bin. 
Meine Freizeit widme ich mit Passion und Leidenschaft der Natur, sowohl als Jäger als auch als Landschaftsfotograf. 

Von diesem Blog könnt ihr alles erwarten, was sich irgendwie im Dunstkreis zwischen Technik und Natur bewegt. 

Freut mich dich dabei zu haben, ich hoffe du kannst aus den Inhalten etwas für dich mitnehmen!
"""

# Collection to display on home
homeCollectionTitle = 'Beiträge'
homeCollection = 'posts'

# Lists parameters
paginationSize = 25
listSummaries = true
listDateFormat = "02.01.2006"
DateForm = "02.01.2006"


# Breadcrumbs
[params.breadcrumbs]
enabled = true
showCurrentPage = false
home = "Home"

