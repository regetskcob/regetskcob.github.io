baseURL = 'https://regetskcob.github.io'
languageCode = 'de-de'
defaultContentLanguage = 'de'
title = 'regetskcob'
theme = 'typo'
enableRobotsTXT = true

# Don't publish original bundle images: the custom render-image hook emits
# resized WebP renditions, so the originals would only bloat the Pages artifact.
[[cascade]]
  [cascade.build]
    publishResources = false
  [cascade._target]
    path = '/posts/**'

[taxonomies]
tag = 'tags'

[module]
  [[module.imports]]
    path = 'github.com/hugomods/umami-analytics'
    
[caches]
  [caches.images]
    dir = ':cacheDir/images'

[params]
# Meta description
description = "Eine wilde Mischung aus Natur, Fotografie und Technik."

# Appearance settings
colorPalette = 'default'
hideHeader = false

# Intro on main page, content is markdown
homeIntroTitle = 'Hi!'
homeIntroContent = """
ich bin Daniel, online meistens als @regetskcob unterwegs. Beruflich bin ich Software Entwickler bei der BWI GmbH, wo ich in der Prototypen-Entwicklung mit Flutter tätig bin. 
Meine Freizeit widme ich mit Passion und Leidenschaft der Natur, sowohl als Jäger als auch als Landschaftsfotograf. 

Von diesem Blog könnt ihr alles erwarten, was sich irgendwie im Dunstkreis zwischen Technik und Natur bewegt. 

Freut mich dich dabei zu haben, ich hoffe du kannst aus den Inhalten etwas für dich mitnehmen!
"""

# Collection to display on home
homeCollectionTitle = 'Beiträge'
homeCollection = 'posts'

# Lists parameters
paginationSize = 25
listSummaries = true
listDateFormat = "02.01.2006"
singleDateFormat = ":date_long"


# Breadcrumbs
[params.breadcrumbs]
enabled = true
showCurrentPage = false
home = "Home"

# Social icons
[[params.social]]
name = "linkedin"
url = "https://www.linkedin.com/in/regetskcob/"

[[params.social]]
name = "instagram"
url = "https://www.instagram.com/regetskcob/"

[[params.social]]
name = "github"
url = "https://github.com/regetskcob"

[[params.social]]
name = "medium"
url = "https://medium.com/@regetskcob"

# Main menu pages
[[params.menu]]
name = "Start"
url = "/"

[[params.menu]]
name = "Bibliothek"
url = "/library"

[[params.menu]]
name = "Über"
url = "/about"

[[params.menu]]
name = "Rechtliches"
url = "/legal"

# Syntax highlighting is styled by the theme's syntax-highlighting.css
# (theme sets markup.highlight.noClasses = false), so no style is set here.

[params.umami]
enable = true
websiteId = "c06c7f84-1748-4134-a2ab-c3e5b7b0fe5d"
jsLocation = "https://cloud.umami.is/script.js"