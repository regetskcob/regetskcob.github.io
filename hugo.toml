baseURL = 'https://www.regetskcob.de/'
languageCode = 'de-DE'
defaultContentLanguage = 'de'
title = 'regetskcob'
theme = 'typo'
enableRobotsTXT = true

# Hugo gives a page 60 seconds by default. On a build without a warm image cache
# (a runner after many new photos) the WebP renditions of a page with many
# images take longer, and the build stops with "timed out rendering the page
# content". 10 minutes per page is far more than needed and only ever a ceiling.
timeout = '10m'

# Don't publish original bundle images: the custom render-image hook emits
# resized WebP renditions, so the originals would only bloat the Pages artifact.
[[cascade]]
  [cascade.build]
    publishResources = false
  [cascade._target]
    path = '/blog/**'

# A page's date comes from "date" or "publishDate" only. Hugo's default also
# falls back to "lastmod", which hid a page without a date of its own as soon
# as its lastmod lay in the future (Hugo does not build those): the gear page
# vanished the moment its lastmod got a time later than "now". The lastmod
# itself still defaults to the date, nothing changes for posts.
[frontmatter]
  date = ['date', 'publishDate']

[taxonomies]
tag = 'tags'
# Post series ("series" in front matter): each gets an overview page under
# /series/<name>/ (layouts/series/term.html), linked from its parts.
series = 'series'
# Publisher of a reviewed book ("verlag" in front matter): each gets an
# unlisted page /verlag/<name>/ with its reviews (layouts/verlag/term.html),
# a link to hand to the publisher. Linked from nowhere, noindex, no sitemap.
verlag = 'verlag'

[module]
  # Horizont, the design system of the blog and its projects
  # (github.com/regetskcob/horizont, documented at /horizont/): the tokens as
  # data, the symbol codepoints, the web layer's CSS, partials (marks, app
  # icons, device frames, …) and shortcodes (hz-device, hz-badge, …) and its
  # fonts (Mona Sans, Material Symbols; Literata and Monaspace sit next to
  # the theme's own files).
  [[module.imports]]
    path = 'github.com/regetskcob/horizont'
    [[module.imports.mounts]]
      source = 'tokens'
      target = 'data'
    [[module.imports.mounts]]
      source = 'icons'
      target = 'data/horizont_icons'
      includeFiles = ['*.json']
    [[module.imports.mounts]]
      source = 'web/css'
      target = 'assets/css/horizont'
    [[module.imports.mounts]]
      source = 'web/partials'
      target = 'layouts/_partials/horizont'
    [[module.imports.mounts]]
      source = 'web/shortcodes'
      target = 'layouts/_shortcodes'
    [[module.imports.mounts]]
      source = 'web/js'
      target = 'assets/js/horizont'
    [[module.imports.mounts]]
      source = 'web/fonts'
      target = 'static/fonts'
    
[caches]
  [caches.images]
    dir = ':cacheDir/images'

[params]
# Meta description
description = "Landschafts- und Luftbilder vom Niederrhein, Film-Rezepte, Projekte zwischen Technik und Natur und Buchrezensionen, seit 2015."

# Author for <meta name="author"> and the JSON-LD. Not "author": the theme
# prints .Param "author" as a byline, which would then appear on every page.
authorName = "Daniel Bocksteger"

# <title> of the home page; the site title is appended as on every other page
homeTitle = "Fotografie und Technik am Niederrhein"

# Open Graph image for pages that have no image of their own, cropped by
# layouts/partials/head/og-image.html. Path is relative to assets/.
ogImage = "gallery/niederrhein/20190727-dscf0435.jpg"

# Appearance settings
colorPalette = 'default'
hideHeader = false

# The landing page (layouts/index.html): a Kennung, one sentence as the
# headline, a few honest lines. Markdown.
homeIntroKennung = 'Daniel · regetskcob'
homeIntroTitle = 'Ich baue Apps und fotografiere den Niederrhein.'
homeIntroContent = """
Beruflich entwickle ich Software, meist mit Flutter. Nebenher laufen drei eigene Apps, und draußen bin ich mit der Kamera unterwegs, im Wald und im Revier. Von hier geht es zu allem davon.
"""



# Footer, replacing the theme's English credit line. The legal page moved out
# of the main menu and is linked here, where people look for it, together with
# the image rights and the copyright line. The trailing backslashes are
# markdown line breaks: one line each.
# A literal string ('''), so TOML leaves the backslash alone.
footerContent = '''
[Impressum](/legal/#impressum) · [Datenschutz](/legal/#datenschutzerklärung) · [Bildrechte](/legal/#bildrechte)\
© Daniel Bocksteger, alle Rechte vorbehalten\
Mit ❤️ am Niederrhein gebaut mit [Hugo](https://gohugo.io) und [Horizont](/horizont/)
'''

# Under the footer, smaller (layouts/partials/footer.html): where the source
# of the site lives. Markdown.
footerSource = "Quellen unter [github.com/regetskcob/regetskcob.github.io](https://github.com/regetskcob/regetskcob.github.io)"

# The theme's "back to top" text link is replaced by the floating button in
# layouts/partials/hooks/body_end.html, which works on every page.
hideBackToTop = true

# Lists parameters
# The blog list shows every post on one page: the horizon line marks its
# years. Formerly 15 posts per page. Pages 2 and up get their own <title> and
# canonical link (partials/head.html, partials/seo/title.html), so search
# engines do not take /blog/page/2/ for a copy of /blog/. The size is
# [pagination] below, not a param, so that partials/head.html can ask for the
# paginator before layouts/section.html builds the list.
listSummaries = true
singleDateFormat = ":date_long"


# Breadcrumbs, switched off: below "Start" there is only one level, and the
# menu already marks the section. The JSON-LD has no BreadcrumbList either,
# since structured data should only describe what the page shows.
[params.breadcrumbs]
enabled = false
showCurrentPage = false
home = "Start"

# Social icons
# Order of the icons in the home page intro.
[[params.social]]
name = "instagram"
url = "https://www.instagram.com/regetskcob/"

[[params.social]]
name = "github"
url = "https://github.com/regetskcob"

[[params.social]]
name = "linkedin"
url = "https://www.linkedin.com/in/regetskcob/"

# No menu: Horizont's horizon line and its Flurkarte are the navigation
# (layouts/partials/horizon.html, Horizont's tokens/flur.yaml).


# Syntax highlighting is styled by the theme's syntax-highlighting.css
# (theme sets markup.highlight.noClasses = false), so no style is set here.

# EXIF of the photos is read at build time for the lightbox (partials/exif.html).
# Only the shooting data below is kept; the rest, above all the GPS position,
# never leaves Hugo: the repository and the site are public.
[imaging.exif]
disableLatLong = true
disableDate = true
includeFields = '^(Make|Model|LensModel|FNumber|FocalLength|FocalLengthIn35mmFormat|ExposureTime|ISO|ISOSpeedRatings|PhotographicSensitivity|ExposureCompensation|ExposureBiasValue)$'

[pagination]
pagerSize = 1000

# The one photo of the landing page (layouts/index.html), from the series
# Niederrhein.
[params.homePhoto]
image = "gallery/niederrhein/20190727-dscf0435.jpg"
alt = "Sonnenuntergang über einem Kartoffelfeld, eine Baumgruppe am Horizont, Schleierwolken im goldenen Abendhimmel"
