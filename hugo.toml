baseURL = 'https://www.regetskcob.de/'
languageCode = 'de-DE'
defaultContentLanguage = 'de'
title = 'regetskcob'
theme = 'typo'
enableRobotsTXT = true

# Don't publish original bundle images: the custom render-image hook emits
# resized WebP renditions, so the originals would only bloat the Pages artifact.
[[cascade]]
  [cascade.build]
    publishResources = false
  [cascade._target]
    path = '/blog/**'

[taxonomies]
tag = 'tags'

[module]
  [[module.imports]]
    path = 'github.com/hugomods/umami-analytics'
    
[caches]
  [caches.images]
    dir = ':cacheDir/images'

[params]
# Meta description
description = "Landschaftsfotografie vom Niederrhein und Projekte zwischen Technik und Natur: KNX im Eigenheim, Messwerte in Grafana, ein selbstgebauter Astro-Tracker."

# Author for <meta name="author"> and the JSON-LD. Not "author": the theme
# prints .Param "author" as a byline, which would then appear on every page.
authorName = "Daniel Bocksteger"

# <title> of the home page; the site title is appended as on every other page
homeTitle = "Fotografie und Technik am Niederrhein"

# Open Graph image for pages that have no image of their own, cropped by
# layouts/partials/head/og-image.html. Path is relative to assets/.
ogImage = "gallery/niederrhein/20190727-dscf0435.jpg"

# Appearance settings
colorPalette = 'default'
hideHeader = false

# Intro on main page, content is markdown
homeIntroTitle = 'Hi!'
homeIntroContent = """
Ich bin Daniel, online als @regetskcob unterwegs. Beruflich entwickle ich Software, überwiegend mit Flutter. Meine freie Zeit verbringe ich draußen, mit der Kamera am Niederrhein, im Wald und im Revier.

Hier findet ihr beides: Landschaftsfotografie aus der Gegend vor meiner Haustür und Berichte aus Projekten, die zwischen Technik und Natur entstehen. KNX im Eigenheim, Messwerte in Grafana, ein selbstgebauter Astro-Tracker.
"""

# Collection to display on home
homeCollectionTitle = 'Beiträge'
homeCollection = 'blog'
# How many posts the landing page shows before linking to /blog/
homeCollectionLimit = 5
# Heading above the photo gallery; the images come from data/gallery.yaml
galleryTitle = 'Fotografie'

# Footer, replacing the theme's English credit line. The legal page moved out
# of the main menu and is linked here, where people look for it.
footerContent = "[Impressum](/legal/#impressum) · [Datenschutz](/legal/#datenschutzerklärung) · Gebaut mit [Hugo](https://gohugo.io) und [typo](https://github.com/tomfran/typo)"

# The theme's "back to top" text link is replaced by the floating button in
# layouts/partials/hooks/body_end.html, which works on every page.
hideBackToTop = true

# Lists parameters
# All posts on one page. With two pages, /blog/page/2/ had the title and
# canonical link of /blog/, so search engines treated it as a duplicate.
paginationSize = 100
listSummaries = true
singleDateFormat = ":date_long"


# Breadcrumbs
[params.breadcrumbs]
enabled = true
showCurrentPage = false
home = "Start"

# Social icons
[[params.social]]
name = "linkedin"
url = "https://www.linkedin.com/in/regetskcob/"

[[params.social]]
name = "instagram"
url = "https://www.instagram.com/regetskcob/"

[[params.social]]
name = "github"
url = "https://github.com/regetskcob"

# Main menu pages
[[params.menu]]
name = "Start"
url = "/"

[[params.menu]]
name = "Niederrhein."
url = "/niederrhein"

[[params.menu]]
name = "Ausrüstung"
url = "/ausruestung"

[[params.menu]]
name = "Rezepte"
url = "/rezepte"

[[params.menu]]
name = "Blog"
url = "/blog"

[[params.menu]]
name = "Über"
url = "/about"


# Syntax highlighting is styled by the theme's syntax-highlighting.css
# (theme sets markup.highlight.noClasses = false), so no style is set here.

[params.umami]
enable = true
websiteId = "c06c7f84-1748-4134-a2ab-c3e5b7b0fe5d"
jsLocation = "https://cloud.umami.is/script.js"