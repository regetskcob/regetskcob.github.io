{{/*
  Notes under a table, used by both the basics blocks and the recipes.
  Expects the notes list as context. "tone: warn" makes a note stand out.
*/}}
{{- range $n := . }}
<aside class="recipe-note{{ if eq $n.tone "warn" }} recipe-note-warn{{ end }}">
  {{- with $n.title }}<strong>{{ . }}</strong>{{ end }}
  {{ $n.text }}
</aside>
{{- end }}
