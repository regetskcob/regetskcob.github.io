{{- /* Overrides the theme's tag: counts only on the live domain (no previews,
  no local builds) and leaves out browsers that send Do Not Track, as the
  privacy notice on /legal/ promises. */ -}}
<script
  async
  defer
  data-website-id="{{ .Site.Params.umami.websiteId }}"
  data-domains="www.regetskcob.de,regetskcob.de"
  data-do-not-track="true"
  src="{{ .Site.Params.umami.jsLocation }}"
></script>
