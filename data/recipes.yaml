# The JPEG recipes of the C slots, rendered by layouts/_default/recipes.html on
# content/rezepte.md. Values as of the recipe card dated 2026-09-17, except the
# A2 minimum ISO on the X-T5, raised from 125 to 250 so that DR200 in C3 applies.
#
# Bank minimum ISOs must not drop below what the recipes' dynamic range needs:
# DR200 from ISO 320 (X-T30) / 250 (X-T5), DR400 from 640 / 500.
#
# Two levels: "basics" sits above all recipes (autofocus, auto ISO banks,
# settings that stay put), and each C slot below lists only its image
# parameters. Anything that applies to all three recipes belongs at the top,
# not in every single table.
#
# Each row under "settings" carries either
#   value           applies to both bodies, the table stays two columns, or
#   xt30 and xt5    one value per body, the table renders three columns.
# As soon as a single row is split, the whole table becomes three columns.
#
# Labels follow the camera's German menu wording and must be identical across
# recipes, so the same setting reads the same in every table.

bodies:
  xt30: "X-T30 (X-Trans IV)"
  xt5: "X-T5 (X-Trans V)"
  shared: "Beide Bodys"

closing: >-
  Kurz gesagt: C1 ist die Serie, C2 ihre ältere Schwester und C3 der
  Freundschaftsdienst, wenn Freunde oder Bekannte fragen. Neue Ideen probiere
  ich zuhause aus, draußen bleibt es bei diesen dreien.

# The basics above all recipes. Every block has a "kind":
#   table   setting and value, like the recipes
#   banks   the auto ISO banks with their own columns
#   list    a plain list
basics:
  - kind: "table"
    title: "Autofokus"
    intro: >-
      Auf beiden Bodys gleich aufgesetzt. Greift die Verfolgung einmal nicht,
      gehe ich kurz auf Einzelfeld, nehme das Motiv auf und wieder zurück. Nach
      der Ursache suche ich später in Ruhe am Schreibtisch.
    rows:
      - label: "AF-Modus"
        value: "Weit / Verfolgung"
      - label: "AF-C Custom"
        value: "Set 6 (eigene Werte)"
      - label: "Tracking-Empfindlichkeit"
        value: "4"
      - label: "Speed-Tracking"
        value: "1"
      - label: "Zonenbereichswechsel"
        value: "Mitte"
      - label: "Gesichts- und Augenerkennung"
        value: "an"
    notes:
      - title: "Tracking 4, Speed 1, Mitte"
        text: >-
          Tracking 4 hält am Motiv fest, auch wenn kurz ein Halm oder ein
          Zaunpfahl davorsteht. Speed 1 reagiert zügig auf Tempowechsel, also
          auf Tiere, Maschinen und Leute, die losgehen. Zonenbereichswechsel
          Mitte fängt das Motiv erst in der Bildmitte ein und wandert dann mit,
          das passt mir besser als „Auto“, das schon beim Aufnehmen der Kamera
          anfängt zu suchen.

  - kind: "banks"
    title: "Auto-ISO-Bänke"
    intro: >-
      Aufsteigend nach Maximal-ISO sortiert, so weiß ich auch im Dunkeln, in
      welche Richtung ich drehen muss. Aufgeteilt ist nach Situation, da die
      AUTO-Mindestverschlusszeit die Brennweite ohnehin berücksichtigt. Über die
      Bank entscheiden also Licht und Bewegung.
    banks:
      - bank: "A1"
        purpose: "Ruhiges Motiv, gutes Licht. Landschaft, Architektur."
        xt30: "640 · max 1600"
        xt5: "640 · max 3200"
        time: "AUTO"
        recipes: "C1 · C2"
      - bank: "A2"
        purpose: "Wenig Licht, Menschen. Innenräume, Feiern im Freundeskreis."
        xt30: "320 · max 3200"
        xt5: "250 · max 6400"
        time: "1/250 s"
        recipes: "C3"
      - bank: "A3"
        purpose: "Bewegung, Tiere, Tele."
        xt30: "640 · max 6400"
        xt5: "640 · max 12800"
        time: "1/500 s"
        recipes: "C1 · C3"
    notes:
      - title: "Mehr Spielraum an der X-T5"
        text: >-
          Die Untergrenzen folgen dem Dynamikbereich der Rezepte, denn DR400
          greift an der X-T30 erst ab ISO 640 und an der X-T5 ab 500, DR200 ab
          320 bzw. 250. Die Maximalwerte der X-T5 liegen eine Blendenstufe über
          denen der X-T30, weil der neuere Sensor das verträgt. Rauscht eine Bank
          in der Praxis zu stark, drehe ich an ihrem Maximum und lasse das Rezept
          in Ruhe.

  - kind: "list"
    title: "Was immer steht"
    items:
      - "Fine + RAW komprimiert, L 3:2"
      - "Mechanischer Verschluss, elektronisch nur bewusst"
      - "Antrieb CL 5 B/s, Serie nur da, wo sie nötig ist"
      - "NR bei Langzeitbelichtung an"
      - "Karten der X-T5 im Backup-Modus, sobald ich für Freunde fotografiere"
    notes:
      - title: "Geändert wird am Schreibtisch"
        tone: "warn"
        text: >-
          Passt draußen eine Einstellung nicht, schreibe ich sie mir auf und
          ändere sie erst zuhause, an beiden Kameras gleichzeitig. Wer unterwegs
          daran dreht, hat nach drei Ausflügen zwei Bodys, die unterschiedlich
          ticken.

recipes:
  - slot: "C1"
    name: "Niederrhein."
    intro: >-
      Die Basis der Serie. Aus Online-Rezepten abgeleitet und über die Jahre so
      lange auf die Gegend hier zugeschnitten, bis die Felder und der Dunst so
      aussehen, wie ich sie in Erinnerung habe.
    settings:
      - label: "Filmsimulation"
        value: "Classic Chrome"
      - label: "Dynamikbereich"
        value: "DR400"
      - label: "D-Bereichspriorität"
        value: "aus"
      - label: "Ton Lichter"
        value: "0"
      - label: "Ton Schatten"
        value: "+1"
      - label: "Farbe"
        value: "−1"
      - label: "Schärfe"
        xt30: "0"
        xt5: "−1"
      - label: "Rauschreduktion"
        xt30: "0"
        xt5: "−2"
      - label: "Klarheit"
        value: "0"
      - label: "Körnung"
        value: "aus"
      - label: "Farbchrom-Effekt"
        value: "aus"
      - label: "Weißabgleich"
        value: "Auto"
    notes:
      - title: "Schärfe und Rauschen an der X-T5"
        text: >-
          40 MP an X-Trans V zeichnen von Haus aus härter und sauberer.
          Schärfe −1 und Rauschreduktion −2 gleichen das wieder aus. Dieselben
          Zahlen wie an der X-T30 wirken an der X-T5 überschärft.

  - slot: "C2"
    name: "Nostalgic Niederrhein."
    settings_title: "Abweichung zu C1"
    intro: >-
      Dieselbe Basis, dieselbe Handschrift, nur nostalgischer. Alle hier nicht
      genannten Werte bleiben exakt wie bei C1.
    settings:
      - label: "WA-Shift (wärmer)"
        value: "R +4 / B −5"
      - label: "Körnung"
        value: "schwach, klein"
      - label: "Klarheit"
        value: "−2"
      - label: "Schärfe"
        xt30: "−1"
        xt5: "−2"
    notes:
      - title: "Kein Stimmungsschalter"
        text: >-
          C2 ist für Motive, die ohnehin alt sind: Backstein, Kopfsteinpflaster,
          Hofstellen, verwitterte Türen. Nicht für „heute ist mir melancholisch“,
          sonst fällt die Serie auseinander.

  - slot: "C3"
    name: "Event"
    intro: >-
      Für Menschen in Innenräumen, meistens auf Feiern bei Freunden und
      Bekannten. Pro Neg. Std hält die Hauttöne flach und
      korrigierbar, DR200 rettet die Fenster im Hintergrund, und
      Rauschreduktion −2 lässt Struktur stehen statt Wachshaut.
    settings:
      - label: "Filmsimulation"
        value: "Pro Neg. Std"
      - label: "Dynamikbereich"
        value: "DR200"
      - label: "D-Bereichspriorität"
        value: "nicht genutzt"
      - label: "Ton Lichter"
        value: "−1"
      - label: "Ton Schatten"
        value: "0"
      - label: "Farbe"
        value: "0"
      - label: "Schärfe"
        value: "−1"
      - label: "Rauschreduktion"
        value: "−2"
      - label: "Klarheit"
        value: "0"
      - label: "Körnung"
        value: "aus"
      - label: "Farbchrom-Effekt"
        value: "nicht genutzt"
      - label: "Weißabgleich"
        value: "Eigene Einstellung 1"
      - label: "WA-Shift"
        value: "0 / 0"
    notes:
      - title: "Ohne gemessenen Weißabgleich ist das nur ein halbes Rezept"
        tone: "warn"
        text: >-
          „Eigene Einstellung 1“ ist der Platzhalter für den Wert, den ihr vor
          Ort messt. Ohne diese Messung stimmt der Rest der Zahlen zwar, die
          Farbe aber nicht.
