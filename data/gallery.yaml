# Photo galleries shown on the home page.
#
# Each block renders as its own titled section, in the order listed here; to
# add a new theme, append another block at the bottom. Within a block the
# photos appear in a random order on every visit, in the same grid as the
# Niederrhein. series (layouts/partials/photo-grid.html).
#
# Per item: "image" is a file under assets/gallery/, or, together with "post",
# a file in that blog post's page bundle (the tile then links to the post).
# "alt" describes the photo for screen readers and belongs on every item.
# Portraits and panoramas are detected on their own. On every visit a few
# random landscape photos (about one in six) show at twice the size; set
# "size: large" on items to pick those by hand for a block instead.
#
# Source files were resized to 2000px on the long edge and stripped of all
# metadata before being added — the originals carried GPS coordinates and this
# repository is public.

