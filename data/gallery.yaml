# Photo galleries shown on the home page.
#
# Each block renders as its own titled section, in the order listed here; to
# add a new theme, append another block at the bottom. Within a block the
# photos appear in a random order on every visit, in the same grid as the
# Niederrhein. series (layouts/partials/photo-grid.html).
#
# Per item: "image" is a file under assets/gallery/, or, together with "post",
# a file in that blog post's page bundle (the tile then links to the post).
# "alt" describes the photo for screen readers and belongs on every item.
# "size: large" makes a photo span two columns and two rows; portraits and
# panoramas are detected on their own.
#
# Source files were resized to 2000px on the long edge and stripped of all
# metadata before being added — the originals carried GPS coordinates and this
# repository is public.

galleries:
  - title: "Luftbilder"
    description: "Mit der Drohne über Felder und Dörfer, am liebsten früh am Morgen im Nebel."
    items:
      - image: "luftbilder/dji-0308.jpg"
        alt: "Luftaufnahme einer Ortschaft im Morgennebel, der Kirchturm ragt aus dem Dunst, davor Wiesen und ein gestreifter Acker"
      - image: "luftbilder/dji-0311.jpg"
        alt: "Luftaufnahme desselben Ortes im Gegenlicht, Nebelschleier ziehen zwischen den Häusern und Bäumen"
      - image: "luftbilder/dji-20240806-071000.jpg"
        alt: "Luftaufnahme über Feldern, Nebelschwaden liegen in den Senken, ein Windrad und lange Schatten im Morgenlicht"
      - image: "luftbilder/dji-20250310-074904.jpg"
        alt: "Luftaufnahme einer Anhöhe im goldenen Morgendunst, lange Baumschatten fallen über das Feld"
      - image: "luftbilder/dji-20250310-081026.jpg"
        alt: "Luftaufnahme eines Dorfes im Gegenlicht, Nebel liegt über den umliegenden Feldern, am Horizont Windräder"
      - image: "luftbilder/dji-20250327-072352.jpg"
        alt: "Luftaufnahme über einem Nebelmeer, eine Reihe kahler Bäume wirft lange Schatten in das Morgenlicht"
      - image: "luftbilder/dji-20260824-072346.jpg"
        alt: "Luftaufnahme über einem Maisfeld, Bodennebel zieht in Bändern, die Sonne steht knapp über dem Horizont"
      - image: "luftbilder/dji-20260824-073128.jpg"
        alt: "Luftaufnahme über Feldern und Baumgruppen, Nebelbänke und lange Schatten, rechts ein Hochsitz am Feldrand"
      - image: "luftbilder/kalkar-3.jpg"
        alt: "Luftaufnahme von Kalkar mit Kirche und Mühlenturm im Ortskern, davor Wiesen, eine Kopfweidenreihe und ein Bachlauf"

  - title: "Menschen"
    description: "Freunde und Bekannte, auf Feiern und unterwegs."
    # Photos go to assets/gallery/menschen/. The block stays hidden while empty.
    items: []

  - title: "Tiere"
    description: "Wild aus dem Revier und was mir draußen sonst vor die Linse läuft."
    # Photos go to assets/gallery/tiere/. The block stays hidden while empty.
    items: []

