# Photographic gear, rendered by layouts/_default/gear.html on
# content/ausruestung.md.
#
# Same shape as data/gallery.yaml: named blocks that appear top to bottom in the
# order of this file. A new block is added by appending it at the bottom; the
# template does not need to change.
#
# Per block, optional:
#   description   A short line or two under the heading.
#   image / alt   A photo under the list; the file lives in assets/gear/.
#   beside        true places the block next to the one before it, two
#                 columns on wider screens, photos right under the headings.
#
# Per entry:
#   name    Required. The label as it appears in the row.
#   note    Optional. Why it is in the bag, in one sentence.
#
# Deliberately without links: no shop references, no affiliate links.

groups:
  - title: "Kameras"
    description: "Zwei Bodys, gleich eingerichtet, damit ich mich beim Wechsel nicht umgewöhnen muss. Die L-Griffe sind Arca-kompatibel und gehen direkt auf die Stative weiter unten, ohne dass eine eigene Schnellwechselplatte übersteht, hängen bleibt oder die Kamera auf dem Tisch kippeln lässt."
    items:
      - name: "Fujifilm X-T5"
        note: "Seit September 2026 die Hauptkamera. Mit SmallRig L-Bracket Grip 4260 und rotem, konkavem JJC-Softauslöser."
      - name: "Fujifilm X-T30"
        note: "Bleibt als Zweitbody dabei, mit SmallRig L-Griff 5664 und demselben JJC-Softauslöser."

  - title: "Objektive"
    items:
      - name: "XF 16-80mm f/4 R OIS WR"
        note: "Das Immerdrauf. Gebraucht gekauft, deckt fast alles ab, was ich draußen brauche."
      - name: "XF 70-300mm f/4-5.6 R LM OIS WR"
        note: "Für Wild, Schafe und alles, was mich nicht näher ranlässt."
      - name: "XF 56mm f/1.2 R"
        note: "Die Version von 2014, ohne Wetterschutz. Für Portraits und Abende mit wenig Licht."

  - title: "Filter"
    description: "Alles auf 72 mm gebracht, damit ein Satz für alle Objektive reicht."
    items:
      - name: "K&F 72-mm-Set: VND, CPL, UV"
      - name: "Step-up-Ringe 62→72 und 67→72 mm"
        note: "Der pragmatische Teil: ein Filtersatz statt drei."

  - title: "Aus der Luft"
    items:
      - name: "DJI Mini 3 Pro"
        note: "Für die Luftbilder rund um Kalkar. Mit K&F-Filterset (CPL, ND8, ND16) und SOLKIN 0.65x Weitwinkelvorsatz."
      - name: "Yuneec H520e mit Wärmebildoptik"
        note: "Im Frühjahr für die Kitzrettung unterwegs, nicht für Bilder."
      - name: "EU-Kompetenznachweis A1/A3 und Fernpilotenzeugnis A2"

  - title: "Bewegtbild"
    items:
      - name: "DJI Osmo Pocket 4"
        note: "Mit SmallRig-Filterset und -Käfig. Passt in die Jackentasche und läuft nebenher mit."
      - name: "DJI Mic Mini"
        note: "Erste Generation, hängt ohne Umwege direkt an der Pocket 4."

  - title: "Stative"
    items:
      - name: "Diverse Stative von 20 bis 150 cm"
        note: "SmallRig, C-Rope, Joby und K&F, je nachdem wie weit der Weg ist."

  - title: "Rucksack"
    image: "rucksack.jpg"
    alt: "Der Fotorucksack steht im Gegenlicht auf einer nassen Wiese, seitlich das Stativ angeschnallt, dahinter Nebel über den Feldern und die aufgehende Sonne"
    items:
      - name: "Lowepro Whistler BP 450 AW II"
        note: "Robust und vielseitig. Es passt wörtlich alles rein."
      - name: "Wasserfest, dazu eine integrierte Regenhülle"
      - name: "Kamerazugang über den Rücken, die Tragefläche bleibt aus dem Matsch"
      - name: "Wasserdicht getrenntes Frontfach für Stative und Multiklemmen"
      - name: "Seitlich Platz für ein Stativ"

  - title: "Immer dabei"
    beside: true
    image: "immer-dabei.jpg"
    alt: "Geöffnete Organizer-Tasche auf einer Holzplatte: Powerbank, Ladegerät, Travelrouter, Netzwerkadapter und aufgerollte Kabel in den Fächern, dazu eine Taschenlampe, ein rotes Taschenmesser, ein Multitool im Netzbeutel und Stifte unter einem Gummiband"
    items:
      - name: "tomtoc Tech Pouch, Größe M"
        note: "Klein, und darin alles, was man unterwegs so brauchen könnte. Kommt auch mit, wenn die Kamera zu Hause bleibt."
      - name: "Ladegerät und Powerbank"
      - name: "Ladekabel jeder erdenklichen Art und diverse Adapter"
      - name: "UniFi Travel Router"
      - name: "SSD, SD-Karten und USB-Sticks"
      - name: "Ein paar Wera Kraftform Micro"
      - name: "Multitool und Taschenmesser"
      - name: "Taschenlampe"
      - name: "Rotring-Druckbleistift und Apple Pencil"

  - title: "Rechner und Software"
    items:
      - name: "MacBook Pro 14\" M2 Pro"
      - name: "LaCie Rugged, 4 TB"
        note: "Die Zwischenstation beim Sichern: von der SD-Karte auf die Platte, von dort der Import in Apple Fotos."
      - name: "Apple Fotos"
        note: "Verwaltung. Läuft über alle Geräte hinweg, ohne dass ich etwas dafür tun muss."
      - name: "Photomator"
        note: "Bearbeitung. Bewusst kein Adobe-Abo, weil ich das für ein Hobby nicht ausgeben will."

  - title: "Hilfsmittel"
    items:
      - name: "Calibrite ColorChecker Passport Photo 2"
        note: "Meine erste Graukarte nach 20 Jahren Fotografie."
      - name: "Leica Sofort 2"
        note: "Nutze ich fast nur als Sofortdrucker, wenn jemand ein Bild mitnehmen soll."

